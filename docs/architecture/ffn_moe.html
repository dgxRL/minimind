</style></head><body><div class="wrap"><nav><a href="index.html">Overview</a><a href="block_attention.html">Block &amp; Attention</a><a href="kda.html">Kimi Delta Attention</a><a href="ffn_moe.html" class=on>FFN &amp; MoE</a><a href="attnres.html">Attention Residuals</a><a href="inference.html">Cache &amp; Generation</a><a href="../model_architecture.html">Original doc (pre-KDA)</a></nav><h1>FFN &amp; Mixture of Experts</h1><p class="lead">The channel-mixing half of each block. It is unchanged by KDA.</p><h2>SwiGLU FeedForward</h2><figure><div class="scroll"><svg class="d" viewBox="0 0 790 200" style="min-width:489px" role="img" aria-label="SwiGLU FFN: gate and up projections to 2432, SiLU on gate, elementwise product, down projection to 768"><defs><marker id="ar-ffn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="as-ffn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="n" x="10" y="80" width="90" height="40" rx="8"/><text class="t" x="55.0" y="104.5" text-anchor="middle">x  (768)</text><rect class="n" x="150" y="30" width="170" height="46" rx="8"/><text class="t" x="235.0" y="50.0" text-anchor="middle">gate_proj</text><text class="s" x="235.0" y="66.0" text-anchor="middle">768 → 2432</text><rect class="n" x="150" y="124" width="170" height="46" rx="8"/><text class="t" x="235.0" y="144.0" text-anchor="middle">up_proj</text><text class="s" x="235.0" y="160.0" text-anchor="middle">768 → 2432</text><rect class="nn" x="370" y="30" width="90" height="46" rx="8"/><text class="t" x="415.0" y="57.5" text-anchor="middle">SiLU</text><circle class="n" cx="520" cy="100" r="14"/><text class="tb" x="520" y="105" text-anchor="middle">×</text><rect class="n" x="570" y="77" width="170" height="46" rx="8"/><text class="t" x="655.0" y="97.0" text-anchor="middle">down_proj</text><text class="s" x="655.0" y="113.0" text-anchor="middle">2432 → 768</text><polyline class="e" points="100,100 125,100 125,53 150,53" marker-end="url(#ar-ffn)"/><polyline class="e" points="125,100 125,147 150,147" marker-end="url(#ar-ffn)"/><polyline class="e" points="320,53 370,53" marker-end="url(#ar-ffn)"/><polyline class="e" points="460,53 520,53 520,86" marker-end="url(#ar-ffn)"/><polyline class="e" points="320,147 520,147 520,114" marker-end="url(#ar-ffn)"/><polyline class="e" points="534,100 570,100" marker-end="url(#ar-ffn)"/><polyline class="e" points="740,100 780,100" marker-end="url(#ar-ffn)"/></svg></div><figcaption><code>FeedForward</code>: <code>down(SiLU(gate(x)) * up(x))</code>, no biases, 5.6M params. Each MoE expert is exactly this module.</figcaption></figure><h2>MOEFeedForward</h2><figure><div class="scroll"><svg class="d" viewBox="0 0 960 370" style="min-width:595px" role="img" aria-label="MoE routing: gate softmax over 4 experts, top-1 with normalization, each expert processes its tokens, weighted index_add combine; aux loss from scores and load"><defs><marker id="ar-moe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="as-moe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="n" x="20" y="60" width="60" height="32" rx="5"/><text class="t" x="50.0" y="80.5" text-anchor="middle">t1</text><rect class="n" x="20" y="104" width="60" height="32" rx="5"/><text class="t" x="50.0" y="124.5" text-anchor="middle">t2</text><rect class="n" x="20" y="148" width="60" height="32" rx="5"/><text class="t" x="50.0" y="168.5" text-anchor="middle">t3</text><rect class="n" x="20" y="192" width="60" height="32" rx="5"/><text class="t" x="50.0" y="212.5" text-anchor="middle">t4</text><rect class="n" x="20" y="236" width="60" height="32" rx="5"/><text class="t" x="50.0" y="256.5" text-anchor="middle">t5</text><rect class="n" x="20" y="280" width="60" height="32" rx="5"/><text class="t" x="50.0" y="300.5" text-anchor="middle">t6</text><rect class="nm" x="110" y="150" width="150" height="60" rx="8"/><text class="t" x="185.0" y="177.0" text-anchor="middle">gate  768 → 4</text><text class="s" x="185.0" y="193.0" text-anchor="middle">softmax over experts</text><rect class="nm" x="300" y="150" width="150" height="60" rx="8"/><text class="t" x="375.0" y="177.0" text-anchor="middle">top-1</text><text class="s" x="375.0" y="193.0" text-anchor="middle">w = score / Σ score</text><rect class="nm" x="520" y="20" width="170" height="66" rx="8"/><text class="t" x="605.0" y="50.0" text-anchor="middle">expert 0</text><text class="s" x="605.0" y="66.0" text-anchor="middle">SwiGLU · 5.6M</text><polyline class="e" points="450,180 485,180 485,53 520,53" marker-end="url(#ar-moe)"/><polyline class="e" points="690,53 715,53 715,180 740,180" marker-end="url(#ar-moe)"/><rect class="nm" x="520" y="106" width="170" height="66" rx="8"/><text class="t" x="605.0" y="136.0" text-anchor="middle">expert 1</text><text class="s" x="605.0" y="152.0" text-anchor="middle">SwiGLU · 5.6M</text><polyline class="e" points="450,180 485,180 485,139 520,139" marker-end="url(#ar-moe)"/><polyline class="e" points="690,139 715,139 715,180 740,180" marker-end="url(#ar-moe)"/><rect class="nm" x="520" y="192" width="170" height="66" rx="8"/><text class="t" x="605.0" y="222.0" text-anchor="middle">expert 2</text><text class="s" x="605.0" y="238.0" text-anchor="middle">SwiGLU · 5.6M</text><polyline class="e" points="450,180 485,180 485,225 520,225" marker-end="url(#ar-moe)"/><polyline class="e" points="690,225 715,225 715,180 740,180" marker-end="url(#ar-moe)"/><rect class="nm" x="520" y="278" width="170" height="66" rx="8"/><text class="t" x="605.0" y="308.0" text-anchor="middle">expert 3</text><text class="s" x="605.0" y="324.0" text-anchor="middle">SwiGLU · 5.6M</text><polyline class="e" points="450,180 485,180 485,311 520,311" marker-end="url(#ar-moe)"/><polyline class="e" points="690,311 715,311 715,180 740,180" marker-end="url(#ar-moe)"/><text class="el" x="490" y="14" text-anchor="start">only tokens with idx = e</text><rect class="n" x="740" y="150" width="180" height="60" rx="8"/><text class="t" x="830.0" y="177.0" text-anchor="middle">combine</text><text class="s" x="830.0" y="193.0" text-anchor="middle">y.index_add_(tok, w · out)</text><rect class="nn" x="110" y="290" width="340" height="60" rx="8"/><text class="t" x="280.0" y="317.0" text-anchor="middle">aux_loss = 4 · 5e-4 · Σₑ loadₑ · mean_scoreₑ</text><text class="s" x="280.0" y="333.0" text-anchor="middle">loadₑ = share of tokens routed to e</text><polyline class="e" points="80,76 94,76"/><polyline class="e" points="80,120 94,120"/><polyline class="e" points="80,164 94,164"/><polyline class="e" points="80,208 94,208"/><polyline class="e" points="80,252 94,252"/><polyline class="e" points="80,296 94,296"/><polyline class="e" points="94,76 94,296"/><polyline class="e" points="94,180 110,180" marker-end="url(#ar-moe)"/><polyline class="e" points="260,180 300,180" marker-end="url(#ar-moe)"/><polyline class="e" points="920,180 950,180" marker-end="url(#ar-moe)"/><polyline class="e" points="185,210 185,290" marker-end="url(#ar-moe)"/><text class="el" x="192" y="254" text-anchor="start">scores</text><polyline class="e" points="375,210 375,290" marker-end="url(#ar-moe)"/><text class="el" x="382" y="254" text-anchor="start">idx</text></svg></div><figcaption><code>MOEFeedForward</code> (<code>use_moe=1</code>). Each token runs one of 4 experts, so active params per layer stay at one FFN while total params are 4×. Experts that receive no tokens in a step get a zero-valued gradient term, which keeps DDP from hanging on unused parameters. The aux loss pushes the router towards balanced load. MoE is independent of KDA and changes only the FFN slot.</figcaption></figure></div></body></html>
