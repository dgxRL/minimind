*{box-sizing:border-box}

</style></head><body><div class="wrap"><nav><a href="index.html">Overview</a><a href="block_attention.html" class=on>Block &amp; Attention</a><a href="kda.html">Kimi Delta Attention</a><a href="ffn_moe.html">FFN &amp; MoE</a><a href="attnres.html">Attention Residuals</a><a href="inference.html">Cache &amp; Generation</a><a href="../model_architecture.html">Original doc (pre-KDA)</a></nav><h1>Block &amp; Full Attention</h1><p class="lead">How one <code>MiniMindBlock</code> is wired, and the full-attention token mixer it uses in dense layers.</p><h2>MiniMindBlock</h2><figure><div class="scroll"><svg class="d" viewBox="0 0 720 590" style="min-width:446px" role="img" aria-label="MiniMindBlock: pre-norm, token mixer chosen by layer_types, residual add, pre-norm, FFN or MoE, residual add"><defs><marker id="ar-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="as-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="n" x="200" y="10" width="200" height="36" rx="8"/><text class="t" x="300.0" y="32.5" text-anchor="middle">hidden_states h</text><rect class="nn" x="200" y="76" width="200" height="36" rx="8"/><text class="t" x="300.0" y="98.5" text-anchor="middle">input_layernorm</text><rect class="ng" x="140" y="140" width="340" height="120" rx="10"/><text class="s" x="310" y="158" text-anchor="middle">self_attn — chosen by layer_types[layer_id]</text><rect class="na" x="152" y="168" width="152" height="78" rx="8"/><text class="t" x="228.0" y="196.5" text-anchor="middle">Attention</text><text class="s" x="228.0" y="212.5" text-anchor="middle">GQA · QK-norm</text><text class="s" x="228.0" y="227.5" text-anchor="middle">RoPE or NoPE</text><rect class="nk" x="316" y="168" width="152" height="78" rx="8"/><text class="t" x="392.0" y="196.5" text-anchor="middle">KimiDeltaAttention</text><text class="s" x="392.0" y="212.5" text-anchor="middle">delta rule, per-channel</text><text class="s" x="392.0" y="227.5" text-anchor="middle">decay, fixed state</text><rect class="nn" x="10" y="184" width="100" height="40" rx="8"/><text class="t" x="60.0" y="201.0" text-anchor="middle">past_key_value</text><text class="s" x="60.0" y="217.0" text-anchor="middle">in → out</text><polyline class="e" points="110,204 140,204" marker-end="url(#ar-blk)" marker-start="url(#as-blk)"/><circle class="n" cx="300" cy="290" r="12"/><text class="tb" x="300" y="295" text-anchor="middle">+</text><rect class="nn" x="200" y="330" width="200" height="36" rx="8"/><text class="t" x="300.0" y="352.5" text-anchor="middle">post_attention_layernorm</text><rect class="ng" x="140" y="394" width="340" height="100" rx="10"/><text class="s" x="310" y="412" text-anchor="middle">mlp — chosen by use_moe</text><rect class="nm" x="152" y="422" width="152" height="62" rx="8"/><text class="t" x="228.0" y="450.0" text-anchor="middle">MOEFeedForward</text><text class="s" x="228.0" y="466.0" text-anchor="middle">4 experts · top-1</text><rect class="n" x="316" y="422" width="152" height="62" rx="8"/><text class="t" x="392.0" y="450.0" text-anchor="middle">FeedForward</text><text class="s" x="392.0" y="466.0" text-anchor="middle">SwiGLU 768→2432→768</text><rect class="nn" x="10" y="433" width="100" height="40" rx="8"/><text class="t" x="60.0" y="450.0" text-anchor="middle">aux_loss</text><text class="s" x="60.0" y="466.0" text-anchor="middle">summed by model</text><polyline class="e" points="152,453 110,453" marker-end="url(#ar-blk)"/><circle class="n" cx="300" cy="524" r="12"/><text class="tb" x="300" y="529" text-anchor="middle">+</text><polyline class="e" points="300,46 300,76" marker-end="url(#ar-blk)"/><polyline class="e" points="300,112 300,140" marker-end="url(#ar-blk)"/><polyline class="e" points="300,260 300,278" marker-end="url(#ar-blk)"/><polyline class="e" points="300,302 300,330" marker-end="url(#ar-blk)"/><polyline class="e" points="300,366 300,394" marker-end="url(#ar-blk)"/><polyline class="e" points="300,494 300,512" marker-end="url(#ar-blk)"/><polyline class="e" points="300,536 300,566" marker-end="url(#ar-blk)"/><text class="s" x="312" y="580" text-anchor="start">h out</text><polyline class="e" points="400,28 560,28 560,290 312,290" marker-end="url(#ar-blk)"/><text class="el" x="568" y="160" text-anchor="start">residual 1</text><polyline class="e" points="300,316 600,316 600,524 312,524" marker-end="url(#ar-blk)"/><text class="el" x="608" y="420" text-anchor="start">residual 2</text></svg></div><figcaption>Every block is pre-norm with two residual adds. Only the <code>self_attn</code> slot differs between layer types: <code>build_token_mixer(config, layer_id)</code> picks the module and <code>build_feed_forward(config)</code> picks the FFN. Both mixers share the same <code>forward(x, position_embeddings, past_key_value, use_cache, attention_mask)</code> signature, so the block code does not depend on the choice. With <code>use_attnres</code> the two residual adds are replaced by depth attention (<a href="attnres.html">Attention Residuals</a>).</figcaption></figure><h2>Attention</h2><figure><div class="scroll"><svg class="d" viewBox="0 0 800 630" style="min-width:496px" role="img" aria-label="Attention: q, k, v projections, per-head RMSNorm on q and k, optional RoPE, KV cache concat, repeat_kv, causal attention, o_proj"><defs><marker id="ar-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="as-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="n" x="290" y="10" width="200" height="36" rx="8"/><text class="t" x="390.0" y="32.5" text-anchor="middle">x  (B, T, 768)</text><polyline class="e" points="390,46 390,60 170,60 170,80" marker-end="url(#ar-att)"/><polyline class="e" points="390,46 390,60 390,60 390,80" marker-end="url(#ar-att)"/><polyline class="e" points="390,46 390,60 610,60 610,80" marker-end="url(#ar-att)"/><rect class="na" x="75" y="80" width="190" height="46" rx="8"/><text class="t" x="170.0" y="100.0" text-anchor="middle">q_proj</text><text class="s" x="170.0" y="116.0" text-anchor="middle">768 → 8 heads × 96</text><rect class="na" x="295" y="80" width="190" height="46" rx="8"/><text class="t" x="390.0" y="100.0" text-anchor="middle">k_proj</text><text class="s" x="390.0" y="116.0" text-anchor="middle">768 → 4 heads × 96</text><rect class="na" x="515" y="80" width="190" height="46" rx="8"/><text class="t" x="610.0" y="100.0" text-anchor="middle">v_proj</text><text class="s" x="610.0" y="116.0" text-anchor="middle">768 → 4 heads × 96</text><rect class="nn" x="75" y="152" width="190" height="40" rx="8"/><text class="t" x="170.0" y="176.5" text-anchor="middle">q_norm</text><rect class="nn" x="295" y="152" width="190" height="40" rx="8"/><text class="t" x="390.0" y="176.5" text-anchor="middle">k_norm</text><rect class="nd" x="75" y="218" width="410" height="40" rx="8"/><text class="t" x="280.0" y="235.0" text-anchor="middle">RoPE  cos/sin[start_pos : +T]</text><text class="s" x="280.0" y="251.0" text-anchor="middle">skipped when attn_nope (default with use_kda)</text><rect class="nn" x="295" y="284" width="410" height="46" rx="8"/><text class="t" x="500.0" y="304.0" text-anchor="middle">KV cache</text><text class="s" x="500.0" y="320.0" text-anchor="middle">k = cat(past_k, k) · v = cat(past_v, v)</text><polyline class="e" points="705,307 790,307" marker-end="url(#ar-att)"/><text class="el" x="790" y="326" text-anchor="end">present (k, v)</text><rect class="nn" x="295" y="356" width="410" height="40" rx="8"/><text class="t" x="500.0" y="380.5" text-anchor="middle">repeat_kv × 2  →  8 heads</text><rect class="na" x="75" y="424" width="630" height="84" rx="8"/><text class="t" x="390.0" y="455.5" text-anchor="middle">causal attention</text><text class="s" x="390.0" y="471.5" text-anchor="middle">fast: F.scaled_dot_product_attention(is_causal=True) — when T &gt; 1, no cache, mask all ones</text><text class="s" x="390.0" y="486.5" text-anchor="middle">eager: softmax(QKᵀ/√96 + causal −∞ + (1 − mask)·−1e9) · V</text><rect class="na" x="290" y="536" width="200" height="40" rx="8"/><text class="t" x="390.0" y="560.5" text-anchor="middle">o_proj  768 → 768</text><polyline class="e" points="170,126 170,152" marker-end="url(#ar-att)"/><polyline class="e" points="170,192 170,218" marker-end="url(#ar-att)"/><polyline class="e" points="170,258 170,424" marker-end="url(#ar-att)"/><polyline class="e" points="390,126 390,152" marker-end="url(#ar-att)"/><polyline class="e" points="390,192 390,218" marker-end="url(#ar-att)"/><polyline class="e" points="390,258 390,284" marker-end="url(#ar-att)"/><polyline class="e" points="390,330 390,356" marker-end="url(#ar-att)"/><polyline class="e" points="390,396 390,424" marker-end="url(#ar-att)"/><polyline class="e" points="610,126 610,284" marker-end="url(#ar-att)"/><polyline class="e" points="610,330 610,356" marker-end="url(#ar-att)"/><polyline class="e" points="610,396 610,424" marker-end="url(#ar-att)"/><polyline class="e" points="390,508 390,536" marker-end="url(#ar-att)"/><polyline class="e" points="390,576 390,602" marker-end="url(#ar-att)"/><text class="s" x="400" y="620" text-anchor="start">output (B, T, 768)</text></svg></div><figcaption>Full attention (GQA, 8 query heads sharing 4 KV heads). In the KDA hybrid only layers 3 and 7 use this module, and RoPE is bypassed: the dashed box disappears from the path.</figcaption></figure></div></body></html>
